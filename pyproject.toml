[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-platform-api"
version = "0.1.0"
description = "Minimal FastAPI bootstrap package for the trading platform backend skeleton."
readme = "apps/api/README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.115,<1.0",
    "SQLAlchemy[asyncio]>=2.0,<3.0",
]

[project.optional-dependencies]
test = [
    "detect-secrets==1.5.0",
    "httpx>=0.27,<1.0",
    "mypy==2.3.1",
    "pytest>=8.0,<9.0",
    "ruff==0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["apps/api/src/trading_platform_api"]
show_error_codes = true
warn_unused_configs = true

[tool.setuptools]
package-dir = {"" = "apps/api/src"}

[tool.setuptools.packages.find]
where = ["apps/api/src"]
include = ["trading_platform_api*"]
