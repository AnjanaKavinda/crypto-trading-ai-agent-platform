name: Governed Copilot PR lifecycle

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lifecycle:
    if: github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Transition closed governed PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_STATE: ${{ github.event.pull_request.merged == true && 'workflow:complete' || 'workflow:human-decision-required' }}
          GOVERNED_PR_AUTHORS: ${{ vars.GOVERNED_PR_AUTHORS }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_REVIEWERS: ${{ vars.GOVERNED_REVIEWERS }}
        run: python .github/scripts/transition-pr.py
