name: Governed independent AI review producer
concurrency:
  group: governed-independent-review-${{ github.event.inputs.pr_number }}
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: >-
          PR number to check for an existing current-head independent
          review. This is the only trusted input: it identifies which PR to
          verify, it does not assert a review outcome. Disposition, actual
          review tier, and reviewer identity are never accepted as inputs --
          they are derived only from a real GitHub review already submitted
          against the PR's current head by a reviewer configured in
          GOVERNED_REVIEWER_TIERS.
        required: true
permissions:
  contents: read
  pull-requests: read
  issues: read
jobs:
  produce-review-provenance:
    name: produce-review-provenance
    runs-on: ubuntu-latest
    steps:
      # This job is the trusted independent-review producer execution. It is
      # a separate governed run from the workflow that dispatches or
      # implements PR work, so its GITHUB_RUN_ID/job identity is never the
      # implementer session, and its output is never treated as a
      # controller/human approval by itself; only the signed artifact it
      # emits is consumed by copilot-pr-governance.yml.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch verified GitHub API snapshots
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNED_IMPLEMENTER_SESSION: ${{ vars.GOVERNED_IMPLEMENTER_SESSION }}
          GOVERNED_AI_REVIEWER_ROLE: ${{ vars.GOVERNED_AI_REVIEWER_ROLE }}
          REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.inputs.pr_number }}" > /tmp/pr.json
          gh api --paginate --slurp "repos/${{ github.repository }}/pulls/${{ github.event.inputs.pr_number }}/reviews" > /tmp/reviews.json
          python - <<'PY'
          import json, re
          pr = json.load(open('/tmp/pr.json'))
          body = pr.get('body') or ''
          match = re.search(r'(?im)\b(?:closes|fixes|resolves)\s+#(\d+)', body)
          if not match:
              raise SystemExit('PR has no linked issue')
          open('/tmp/issue_number.txt', 'w').write(match.group(1))
          PY
          gh api "repos/${{ github.repository }}/issues/$(cat /tmp/issue_number.txt)" > /tmp/issue.json
          gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.inputs.pr_number }}/files" > /tmp/files.json
          python - <<'PY'
          import json, os, re
          from hashlib import sha256
          from pathlib import Path
          import sys
          sys.path.insert(0, '.github/scripts')
          from independent_reviewer import build_request
          from orchestrator import detect_secret
          pr = json.load(open('/tmp/pr.json'))
          issue = json.load(open('/tmp/issue.json'))
          files = json.load(open('/tmp/files.json'))
          head = pr.get('head', {}).get('sha')
          base = pr.get('base', {}).get('ref')
          if not head or base != 'dev' or not isinstance(files, list):
              raise SystemExit('current PR head or bounded file list is invalid')
          patches = []
          changed = []
          for item in files:
              path = item.get('filename')
              patch = item.get('patch', '')
              if not path or detect_secret(path + '\n' + patch):
                  raise SystemExit('unsafe or secret-shaped review context')
              changed.append(path)
              patches.append({'path': path, 'status': item.get('status'), 'patch': patch[:12000]})
          diff = json.dumps(patches, sort_keys=True, separators=(',', ':'))
          issue_id = int(re.search(r'(?im)\b(?:closes|fixes|resolves)\s+#(\d+)', pr.get('body') or '').group(1))
          labels = {x.get('name') for x in issue.get('labels', [])}
          required = 'R3' if labels & {'risk:high','risk:critical','type:security','type:architecture','type:contract','impact:security','impact:architecture','impact:shared-contract','impact:trading-risk','impact:approval-execution-ccxt'} else ('R1' if labels & {'risk:low','type:docs','type:test'} else 'R2')
          capability = {'R1':'economical-fast','R2':'strong-coding-reasoning','R3':'premium-strongest-available'}[required]
          request = build_request(
              repository=os.environ['GITHUB_REPOSITORY'], pr_number=int(pr['number']),
              head_sha=head, base_branch=base, github_issue_id=issue_id,
              canonical_issue_id=issue_id, agent_role='Backend/Foundation',
              reviewer_role=os.environ['GOVERNED_AI_REVIEWER_ROLE'],
              required_review_tier=required, capability_tier=capability,
              context_pack_id='context-' + sha256(diff.encode()).hexdigest()[:32],
              context_pack_version='v1.1',
              implementation_session_id=os.environ['GOVERNED_IMPLEMENTER_SESSION'],
              allowed_paths=tuple(changed), forbidden_paths=('secrets/**','.env','services/execution/**'),
              changed_files=tuple(changed), diff_reference='sha256:' + sha256(diff.encode()).hexdigest(),
              required_checks=tuple(x for x in os.environ.get('REQUIRED_CHECKS','').split(',') if x),
              safety_invariants=('no-merge-authority','no-live-trading','human-final-review'),
              controller_policy_version='v1.1')
          if not request.required_checks:
              raise SystemExit('required deterministic checks are not configured')
          Path('/tmp/reviewer-request.json').write_text(json.dumps(request.__dict__, sort_keys=True, default=list))
          Path('/tmp/reviewer-context.json').write_text(json.dumps({
              'issue': {'number': issue.get('number'), 'title': issue.get('title'), 'body': (issue.get('body') or '')[:12000]},
              'pull_request': {'number': pr['number'], 'base': base, 'head_sha': head},
              'changed_files': patches,
              'required_checks': list(request.required_checks),
              'safety_invariants': list(request.safety_invariants),
          }, sort_keys=True))
          PY
      - name: Verify deterministic checks before AI review
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
        run: |
          gh api "repos/${{ github.repository }}/commits/$(jq -r .head.sha /tmp/pr.json)/status" > /tmp/status.json
          gh api --paginate --slurp "repos/${{ github.repository }}/commits/$(jq -r .head.sha /tmp/pr.json)/check-runs" > /tmp/checks.json
          python - <<'PY'
          import json, os
          status=json.load(open('/tmp/status.json'))
          pages=json.load(open('/tmp/checks.json'))
          checks={x.get('context'):x.get('state') for x in status.get('statuses',[]) if x.get('context')}
          checks.update({x.get('name'):x.get('conclusion') for page in pages for x in page.get('check_runs',[]) if x.get('name')})
          required=[x for x in os.environ.get('REQUIRED_CHECKS','').split(',') if x]
          if any(checks.get(name) != 'success' for name in required):
             raise SystemExit('required deterministic check is missing or failed')
          PY
      - name: Execute bounded OpenAI independent reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
        run: python .github/scripts/run-independent-review.py /tmp/reviewer-request.json /tmp/reviewer-result.json --context /tmp/reviewer-context.json
      - name: Re-verify exact current PR head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.inputs.pr_number }}" > /tmp/pr-after.json
          test "$(jq -r .head.sha /tmp/pr-after.json)" = "$(jq -r .head_sha /tmp/reviewer-request.json)"
      - name: Produce signed independent-review provenance artifact
        id: produce
        env:
          GOVERNANCE_PROVENANCE_SIGNING_KEY: ${{ secrets.GOVERNANCE_PROVENANCE_SIGNING_KEY }}
          GOVERNED_BASE: dev
          GOVERNED_REVIEWER_TIERS: ${{ vars.GOVERNED_REVIEWER_TIERS }}
          GOVERNED_REVIEWER_ROLES: ${{ vars.GOVERNED_REVIEWER_ROLES }}
          GOVERNED_IMPLEMENTER_SESSION: ${{ vars.GOVERNED_IMPLEMENTER_SESSION }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_AI_REVIEWER: ${{ vars.GOVERNED_AI_REVIEWER }}
          GOVERNED_AI_REVIEWER_ROLE: ${{ vars.GOVERNED_AI_REVIEWER_ROLE }}
          GOVERNED_REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
          GOVERNED_AUDIT_LOG: /tmp/governance-audit.jsonl
        run: |
          python .github/scripts/produce-review-provenance.py /tmp/pr.json /tmp/reviews.json /tmp/issue.json /tmp/reviewer-result.json > /tmp/review-artifact.json
      - name: Upload signed provenance artifact
        uses: actions/upload-artifact@v4
        with:
          name: review-provenance-${{ github.event.inputs.pr_number }}-${{ github.run_id }}
          path: |
            /tmp/review-artifact.json
            /tmp/reviewer-result.json
            /tmp/governance-audit.jsonl
          retention-days: 90
      - name: Report immutable producer output pointer
        run: |
          echo "Trusted producer output created. This signed artifact -- not any" >&2
          echo "free-form assertion or human-supplied disposition -- is the only" >&2
          echo "value copilot-pr-governance.yml will accept as independent-review" >&2
          echo "provenance. Prefer fetching this immutable run/artifact directly" >&2
          echo "(run id ${{ github.run_id }}); only if that is not feasible should" >&2
          echo "a maintainer copy this exact JSON into the GOVERNED_REVIEW_ARTIFACTS" >&2
          echo "repository variable (as a JSON list), and only as a pointer to this" >&2
          echo "verifiable value, never as a new trust assertion." >&2
          cat /tmp/review-artifact.json
