name: Governed independent AI review producer
concurrency:
  group: governed-independent-review-${{ github.event.inputs.pr_number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false
on:
  workflow_run:
    workflows: ["Governance CI"]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number for a controlled manual validation run.
        required: true
permissions:
  contents: read
  pull-requests: read
  issues: write
  statuses: write
jobs:
  produce-review-provenance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'pull_request' &&
       vars.GOVERNED_PILOT_ENABLED == 'true')
    name: produce-review-provenance
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.inputs.pr_number || github.event.workflow_run.pull_requests[0].number }}
    steps:
      # This job is the trusted independent-review producer execution. It is
      # a separate governed run from the workflow that dispatches or
      # implements PR work, so its GITHUB_RUN_ID/job identity is never the
      # implementer session, and its output is never treated as a
      # controller/human approval by itself; only the signed artifact it
      # emits is consumed by copilot-pr-governance.yml.
      - uses: actions/checkout@v4
        with:
          ref: dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch verified GitHub API snapshots
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNED_IMPLEMENTER_SESSION: ${{ vars.GOVERNED_IMPLEMENTER_SESSION }}
          GOVERNED_AI_REVIEWER_ROLE: ${{ vars.GOVERNED_AI_REVIEWER_ROLE }}
          GOVERNED_PILOT_ISSUES: ${{ vars.GOVERNED_PILOT_ISSUES }}
          GOVERNED_PR_AUTHORS: ${{ vars.GOVERNED_PR_AUTHORS }}
          REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
          REVIEW_CONTEXT_MAX_BYTES: ${{ vars.REVIEW_CONTEXT_MAX_BYTES }}
        run: |
          case "$PR_NUMBER" in (*[!0-9]*|'') echo "PR number must be numeric" >&2; exit 1;; esac
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > /tmp/pr.json
          gh api --paginate --slurp "repos/${{ github.repository }}/pulls/$PR_NUMBER/reviews" > /tmp/reviews.json
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, '.github/scripts')
          from review_provenance import extract_linked_issue
          pr = json.load(open('/tmp/pr.json'))
          try:
              issue_id = extract_linked_issue(pr.get('body') or '')
          except Exception as error:
              raise SystemExit(str(error)) from error
          open('/tmp/issue_number.txt', 'w').write(str(issue_id))
          if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch':
              allowed = {item.strip() for item in os.environ.get(
                  'GOVERNED_PILOT_ISSUES', '').split(',') if item.strip()}
              if '*' not in allowed and str(issue_id) not in allowed:
                  raise SystemExit('linked issue is not on the governed pilot allowlist')
          PY
          gh api "repos/${{ github.repository }}/issues/$(cat /tmp/issue_number.txt)" > /tmp/issue.json
          gh api --paginate --slurp "repos/${{ github.repository }}/issues/$(cat /tmp/issue_number.txt)/comments" > /tmp/issue-comments.json
          python - <<'PY'
          import json, os, re
          if os.environ.get('GITHUB_EVENT_NAME') != 'workflow_dispatch':
              pr = json.load(open('/tmp/pr.json'))
              pages = json.load(open('/tmp/issue-comments.json'))
              comments = [item for page in pages for item in page]
              allowed_authors = {item.strip() for item in os.environ.get(
                  'GOVERNED_PR_AUTHORS', '').split(',') if item.strip()}
              author = (pr.get('user') or {}).get('login')
              if not allowed_authors or author not in allowed_authors:
                  raise SystemExit('automatic review PR author is not governed')
              keys = []
              for comment in comments:
                  body = comment.get('body') or ''
                  if '<!-- governed-copilot-orchestrator:v1 -->' not in body:
                      continue
                  match = re.search(r'dispatch_key:([A-Za-z0-9_-]+)', body)
                  if match:
                      keys.append(match.group(1))
              pr_body = pr.get('body') or ''
              if not keys or not any(key in pr_body for key in keys):
                  raise SystemExit('automatic review PR is not bound to a governed dispatch')
          PY
          gh api --paginate "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" > /tmp/files.json
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER.diff" \
            -H 'Accept: application/vnd.github.v3.diff' > /tmp/pr.diff
          python - <<'PY'
          import json, os, re
          from hashlib import sha256
          from pathlib import Path
          import sys
          sys.path.insert(0, '.github/scripts')
          from independent_reviewer import build_request, extract_allowed_paths_from_issue
          from orchestrator import (detect_high_confidence_secret_material, resolve_agent,
                                    resolve_canonical_number)
          pr = json.load(open('/tmp/pr.json'))
          issue = json.load(open('/tmp/issue.json'))
          files = json.load(open('/tmp/files.json'))
          head = pr.get('head', {}).get('sha')
          base = pr.get('base', {}).get('ref')
          if not head or base != 'dev' or not isinstance(files, list):
              raise SystemExit('current PR head or bounded file list is invalid')
          changed = []
          for item in files:
              path = item.get('filename')
              if not path:
                  raise SystemExit('unsafe or secret-shaped review context')
              changed.append(path)
          diff = Path('/tmp/pr.diff').read_text(encoding='utf-8')
          if not diff or detect_high_confidence_secret_material(diff):
              raise SystemExit('complete changed content is unavailable or contains credential material')
          max_bytes = int(os.environ.get('REVIEW_CONTEXT_MAX_BYTES') or '120000')
          if len(diff.encode()) > max_bytes:
              raise SystemExit('complete changed content exceeds the explicit review context budget')
          from review_provenance import extract_linked_issue
          issue_id = extract_linked_issue(pr.get('body') or '')
          allowed = extract_allowed_paths_from_issue(issue.get('body') or '')
          labels = {x.get('name') for x in issue.get('labels', [])}
          required = 'R3' if labels & {'risk:high','risk:critical','type:security','type:architecture','type:contract','impact:security','impact:architecture','impact:shared-contract','impact:trading-risk','impact:approval-execution-ccxt'} else ('R1' if labels & {'risk:low','type:docs','type:test'} else 'R2')
          capability = {'R1':'economical-fast','R2':'strong-coding-reasoning','R3':'premium-strongest-available'}[required]
          canonical_issue, _ = resolve_canonical_number(issue.get('body') or '')
          agent_role = resolve_agent([
              name for name in labels if isinstance(name, str) and name.startswith('agent:')
          ])
          request = build_request(
              repository=os.environ['GITHUB_REPOSITORY'], pr_number=int(pr['number']),
              head_sha=head, base_branch=base, github_issue_id=issue_id,
              canonical_issue_id=canonical_issue, agent_role=agent_role,
              reviewer_role=os.environ['GOVERNED_AI_REVIEWER_ROLE'],
              required_review_tier=required, capability_tier=capability,
              context_pack_id='context-' + sha256(diff.encode()).hexdigest()[:32],
              context_pack_version='v1.1',
              implementation_session_id=os.environ['GOVERNED_IMPLEMENTER_SESSION'],
              allowed_paths=allowed,
              forbidden_paths=('secrets/**','**/secrets/**','.env','**/.env','services/execution/**'),
              changed_files=tuple(changed), diff_reference='sha256:' + sha256(diff.encode()).hexdigest(),
              required_checks=tuple(x for x in os.environ.get('REQUIRED_CHECKS','').split(',') if x),
              safety_invariants=('no-merge-authority','no-live-trading','human-final-review'),
              controller_policy_version='v1.1')
          if not request.required_checks:
              raise SystemExit('required deterministic checks are not configured')
          Path('/tmp/reviewer-request.json').write_text(json.dumps(request.__dict__, sort_keys=True, default=list))
          Path('/tmp/reviewer-context.json').write_text(json.dumps({
              'issue': {'number': issue.get('number'), 'title': issue.get('title'), 'body': (issue.get('body') or '')[:12000]},
              'pull_request': {'number': pr['number'], 'base': base, 'head_sha': head},
              'changed_files': changed,
              'complete_diff': diff,
              'required_checks': list(request.required_checks),
              'safety_invariants': list(request.safety_invariants),
          }, sort_keys=True))
          PY
      - name: Publish pending governance gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(jq -r .head.sha /tmp/pr.json)"
          gh api --method POST "repos/${{ github.repository }}/statuses/$head_sha" \
            -f state=pending -f context=governance-gate \
            -f description='Independent governed review in progress'
      - name: Verify deterministic checks before AI review
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
          GOVERNED_REVIEWER_MODEL_MAPPING: ${{ vars.GOVERNED_REVIEWER_MODEL_MAPPING }}
          REVIEW_CONTEXT_MAX_BYTES: ${{ vars.REVIEW_CONTEXT_MAX_BYTES }}
        run: |
          gh api "repos/${{ github.repository }}/commits/$(jq -r .head.sha /tmp/pr.json)/status" > /tmp/status.json
          gh api --paginate --slurp "repos/${{ github.repository }}/commits/$(jq -r .head.sha /tmp/pr.json)/check-runs" > /tmp/checks.json
          python - <<'PY'
          import json, os
          status=json.load(open('/tmp/status.json'))
          pages=json.load(open('/tmp/checks.json'))
          checks={x.get('context'):x.get('state') for x in status.get('statuses',[]) if x.get('context')}
          checks.update({x.get('name'):x.get('conclusion') for page in pages for x in page.get('check_runs',[]) if x.get('name')})
          required=[x for x in os.environ.get('REQUIRED_CHECKS','').split(',') if x]
          if any(checks.get(name) != 'success' for name in required):
             raise SystemExit('required deterministic check is missing or failed')
          PY
      - name: Block automatic duplicate paid review for the same head
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head_sha="$(jq -r .head.sha /tmp/pr.json)"
          gh api "repos/${{ github.repository }}/commits/$head_sha/status" > /tmp/pre-review-status.json
          if jq -e '.statuses[]? | select(.context == "governance-gate" and (.state == "success" or .state == "failure" or .state == "error"))' /tmp/pre-review-status.json >/dev/null; then
            echo "A final governance-gate status already exists for this exact head; automatic paid re-review is blocked. Use controlled workflow_dispatch only after human review." >&2
            exit 1
          fi
      - name: Re-verify exact current PR head immediately before AI review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > /tmp/pr-before-model.json
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.github/scripts')
          from independent_reviewer import assert_current_head
          request=json.load(open('/tmp/reviewer-request.json'))
          current=json.load(open('/tmp/pr-before-model.json'))
          assert_current_head(request['head_sha'], current.get('head', {}).get('sha'))
          PY
      - name: Create ephemeral reviewer handoff key
        run: |
          python - <<'PY'
          import os, secrets
          from pathlib import Path
          path = Path('/tmp/reviewer-handoff.key')
          path.write_text(secrets.token_hex(32), encoding='utf-8')
          os.chmod(path, 0o600)
          PY
      - name: Execute bounded OpenAI independent reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
          GOVERNED_REVIEWER_MODEL_MAPPING: ${{ vars.GOVERNED_REVIEWER_MODEL_MAPPING }}
          REVIEW_CONTEXT_MAX_BYTES: ${{ vars.REVIEW_CONTEXT_MAX_BYTES }}
        run: >-
          python .github/scripts/run-independent-review.py
          /tmp/reviewer-request.json /tmp/reviewer-result.json
          --context /tmp/reviewer-context.json
          --attestation /tmp/reviewer-result-attestation.json
          --handoff-key-file /tmp/reviewer-handoff.key
      - name: Re-verify exact current PR head after AI review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$PR_NUMBER" in (*[!0-9]*|'') echo "PR number must be numeric" >&2; exit 1;; esac
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > /tmp/pr-after.json
          test "$(jq -r .head.sha /tmp/pr-after.json)" = "$(jq -r .head_sha /tmp/reviewer-request.json)"
      - name: Re-fetch current PR head immediately before provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > /tmp/pr-final.json
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.github/scripts')
          from independent_reviewer import assert_current_head
          request=json.load(open('/tmp/reviewer-request.json'))
          current=json.load(open('/tmp/pr-final.json'))
          assert_current_head(request['head_sha'], current.get('head', {}).get('sha'))
          PY
      - name: Produce signed independent-review provenance artifact
        id: produce
        env:
          GOVERNANCE_PROVENANCE_SIGNING_KEY: ${{ secrets.GOVERNANCE_PROVENANCE_SIGNING_KEY }}
          GOVERNED_BASE: dev
          GOVERNED_REVIEWER_TIERS: ${{ vars.GOVERNED_REVIEWER_TIERS }}
          GOVERNED_REVIEWER_ROLES: ${{ vars.GOVERNED_REVIEWER_ROLES }}
          GOVERNED_IMPLEMENTER_SESSION: ${{ vars.GOVERNED_IMPLEMENTER_SESSION }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_AI_REVIEWER: ${{ vars.GOVERNED_AI_REVIEWER }}
          GOVERNED_AI_REVIEWER_ROLE: ${{ vars.GOVERNED_AI_REVIEWER_ROLE }}
          GOVERNED_REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
          GOVERNED_REVIEWER_MODEL_MAPPING: ${{ vars.GOVERNED_REVIEWER_MODEL_MAPPING }}
          GOVERNED_AUDIT_LOG: /tmp/governance-audit.jsonl
          GOVERNED_REVIEW_HANDOFF_KEY_FILE: /tmp/reviewer-handoff.key
        run: |
          python .github/scripts/produce-review-provenance.py /tmp/pr-final.json /tmp/reviews.json /tmp/issue.json /tmp/reviewer-result.json /tmp/reviewer-request.json /tmp/reviewer-result-attestation.json > /tmp/review-artifact.json
      - name: Re-verify current head after artifact construction
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" > /tmp/pr-publish.json
          python - <<'PY'
          import json, sys
          sys.path.insert(0, '.github/scripts')
          from independent_reviewer import assert_current_head
          artifact=json.load(open('/tmp/review-artifact.json'))
          current=json.load(open('/tmp/pr-publish.json'))
          assert_current_head(artifact['head_sha'], current.get('head', {}).get('sha'))
          PY
      - name: Consume signed provenance and publish governance gate
        id: governance
        env:
          GH_TOKEN: ${{ github.token }}
          GOVERNED_BASE: dev
          GOVERNED_REVIEWERS: ${{ vars.GOVERNED_REVIEWERS }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_PR_AUTHORS: ${{ vars.GOVERNED_PR_AUTHORS }}
          GOVERNED_PILOT_ENABLED: ${{ vars.GOVERNED_PILOT_ENABLED }}
          GOVERNED_PILOT_ISSUES: ${{ vars.GOVERNED_PILOT_ISSUES }}
          GOVERNED_REVIEWER_ROLES: ${{ vars.GOVERNED_REVIEWER_ROLES }}
          GOVERNED_REVIEWER_TIERS: ${{ vars.GOVERNED_REVIEWER_TIERS }}
          GOVERNED_IMPLEMENTER_SESSION: ${{ vars.GOVERNED_IMPLEMENTER_SESSION }}
          GOVERNED_PROVENANCE_PRODUCER: ${{ github.repository }}/.github/workflows/governed-independent-review.yml@refs/heads/dev
          GOVERNANCE_PROVENANCE_SIGNING_KEY: ${{ secrets.GOVERNANCE_PROVENANCE_SIGNING_KEY }}
          REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
          REQUIRED_REVIEWER_ROLES: ${{ vars.GOVERNED_REQUIRED_REVIEWER_ROLES }}
          GOVERNED_AUDIT_LOG: /tmp/governance-audit.jsonl
          GOVERNED_REVIEW_ARTIFACT_FILE: /tmp/review-artifact.json
          GOVERNED_REVIEW_RESULT_FILE: /tmp/reviewer-result.json
        run: |
          head_sha="$(jq -r .head.sha /tmp/pr-final.json)"
          gh api "repos/${{ github.repository }}/commits/$head_sha/status" > /tmp/status-final.json
          gh api --paginate --slurp "repos/${{ github.repository }}/commits/$head_sha/check-runs" > /tmp/checks-final.json
          export GOVERNED_REVIEW_ARTIFACTS="$(jq -c '[.]' /tmp/review-artifact.json)"
          set +e
          python .github/scripts/run-pr-governance.py \
            /tmp/pr-final.json /tmp/reviews.json /tmp/status-final.json /tmp/checks-final.json /tmp/issue.json
          governance_rc=$?
          set -e
          disposition="$(jq -r .disposition /tmp/reviewer-result.json)"
          if [ "$governance_rc" -eq 0 ]; then
            gh api --method POST "repos/${{ github.repository }}/statuses/$head_sha" \
              -f state=success -f context=governance-gate \
              -f description='Signed independent review approved'
            TARGET_STATE=workflow:ready-to-merge \
              python .github/scripts/transition-pr.py
          else
            gh api --method POST "repos/${{ github.repository }}/statuses/$head_sha" \
              -f state=failure -f context=governance-gate \
              -f description="Independent review disposition: $disposition"
            if [ "$disposition" = "changes-requested" ]; then
              TARGET_STATE=workflow:changes-requested \
                python .github/scripts/transition-pr.py
            else
              TARGET_STATE=workflow:human-decision-required \
                python .github/scripts/transition-pr.py
            fi
            exit "$governance_rc"
          fi
      - name: Upload signed provenance and audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-provenance-${{ env.PR_NUMBER }}-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            /tmp/review-artifact.json
            /tmp/reviewer-result.json
            /tmp/reviewer-request.json
            /tmp/reviewer-result-attestation.json
            /tmp/governance-audit.jsonl
          retention-days: 90
      - name: Fail governance gate if review workflow did not finalize
        if: always() && steps.governance.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f /tmp/pr.json ]; then
            head_sha="$(jq -r .head.sha /tmp/pr.json)"
            gh api --method POST "repos/${{ github.repository }}/statuses/$head_sha" \
              -f state=failure -f context=governance-gate \
              -f description='Governed independent review did not finalize successfully'
          fi
