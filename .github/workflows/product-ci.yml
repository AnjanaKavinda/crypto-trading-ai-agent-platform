name: Product CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-ci:
    name: product-ci
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install product and quality dependencies
        run: python -m pip install --disable-pip-version-check ".[test]"

      - name: Verify installed dependency compatibility
        run: python -m pip check

      - name: Build distributable wheel
        run: >-
          python -m pip wheel --no-deps
          --wheel-dir /tmp/trading-platform-wheel .

      - name: Compile backend source and tests
        run: python -m compileall -q apps/api/src tests/backend

      - name: Lint backend source and tests
        run: python -m ruff check apps/api/src tests/backend

      - name: Verify backend formatting
        run: python -m ruff format --check apps/api/src tests/backend

      - name: Type-check backend package
        run: python -m mypy apps/api/src/trading_platform_api

      - name: Run backend tests
        run: python -m pytest -q tests/backend

      - name: Verify product CI workflow contract
        run: python .github/scripts/test_product_ci.py

      - name: Reject new repository secrets
        run: git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
