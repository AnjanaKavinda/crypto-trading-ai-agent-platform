name: Governed Copilot PR governance
concurrency:
  group: governed-copilot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  track-review:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Enforce mandatory human reviewer separation
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          test "$CONTROLLER" = "AnjanaKavinda"
          if [ "$PR_AUTHOR" = "$CONTROLLER" ]; then
            echo "Governed PRs must not be authored by the final human reviewer. Recreate this PR through the approved bot/agent path." >&2
            exit 1
          fi
          gh api --method POST \
            "repos/${{ github.repository }}/pulls/$PR_NUMBER/requested_reviewers" \
            -f "reviewers[]=$CONTROLLER"

      - name: Validate main promotion shape
        if: github.event.pull_request.base.ref == 'main'
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
        run: |
          test "$PR_HEAD" = "dev" || {
            echo "main accepts only governed promotion PRs from dev" >&2
            exit 1
          }

      - name: Mark governed PR under review
        if: github.event.pull_request.base.ref == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_STATE: workflow:review
          GOVERNED_PR_AUTHORS: ${{ vars.GOVERNED_PR_AUTHORS }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_REVIEWERS: ${{ vars.GOVERNED_REVIEWERS }}
        run: python .github/scripts/transition-pr.py
      - name: Publish pending final governance gate
        if: github.event.pull_request.base.ref == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending -f context=governance-gate \
            -f description='Waiting for deterministic CI and independent review'
      - name: Human merge remains final authority
        run: echo "No workflow step can merge this PR; the human repository owner remains the final merge authority."

  handle-unmerged-close:
    if: github.event.action == 'closed' && github.event.pull_request.merged != true && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Escalate closed unmerged governed PR
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_STATE: workflow:human-decision-required
          GOVERNED_PR_AUTHORS: ${{ vars.GOVERNED_PR_AUTHORS }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_REVIEWERS: ${{ vars.GOVERNED_REVIEWERS }}
        run: python .github/scripts/transition-pr.py

  complete-after-human-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Mark bound issue complete after actual merge
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_STATE: workflow:complete
          GOVERNED_PR_AUTHORS: ${{ vars.GOVERNED_PR_AUTHORS }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_REVIEWERS: ${{ vars.GOVERNED_REVIEWERS }}
        run: python .github/scripts/transition-pr.py

  terminal-governance-diagnostic:
    if: >-
      always() &&
      (needs.track-review.result == 'failure' ||
       needs.handle-unmerged-close.result == 'failure' ||
       needs.complete-after-human-merge.result == 'failure')
    needs: [track-review, handle-unmerged-close, complete-after-human-merge]
    runs-on: ubuntu-latest
    steps:
      - name: Publish terminal governance failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head="${{ github.event.pull_request.head.sha }}"
          gh api --method POST \
            "repos/${{ github.repository }}/statuses/$head" \
            -f state=failure -f context=governance-gate \
            -f description='Governance lifecycle failed; inspect job diagnostics and recover under ADR-0003'
