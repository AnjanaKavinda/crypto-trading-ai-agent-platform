name: Governed Copilot PR governance
concurrency:
  group: governed-copilot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

on:
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

jobs:
  track-review:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Mark governed PR under review
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_STATE: workflow:review
          GOVERNED_PR_AUTHORS: ${{ vars.GOVERNED_PR_AUTHORS }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_REVIEWERS: ${{ vars.GOVERNED_REVIEWERS }}
        run: python .github/scripts/transition-pr.py
      - name: Publish pending final governance gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=pending -f context=governance-gate \
            -f description='Waiting for deterministic CI and independent review'
      - name: Human merge remains final authority
        run: echo "No workflow step can merge this PR; the human repository owner remains the final merge authority."

  complete-after-human-merge:
    if: github.event.action == 'closed' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
      - name: Mark bound issue complete after actual merge
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TARGET_STATE: workflow:complete
          GOVERNED_PR_AUTHORS: ${{ vars.GOVERNED_PR_AUTHORS }}
          GOVERNED_CONTROLLER: ${{ vars.GOVERNED_CONTROLLER }}
          GOVERNED_REVIEWERS: ${{ vars.GOVERNED_REVIEWERS }}
        run: python .github/scripts/transition-pr.py
