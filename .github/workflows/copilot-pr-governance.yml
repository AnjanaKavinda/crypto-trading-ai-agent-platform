name: Governed Copilot PR governance
on:
  pull_request:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
  checks: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      # Validate the trusted base-branch controller, never PR-modified automation.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
      - name: Fetch trusted PR governance inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}" > /tmp/pr.json
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/reviews" > /tmp/reviews.json
          gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/status" > /tmp/status.json
          gh api "repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }}/check-runs" > /tmp/checks.json
      - name: Enforce current-head governance
        env:
          GOVERNED_BASE: dev
          GOVERNED_REVIEWERS: ${{ vars.GOVERNED_REVIEWERS }}
          REQUIRED_CHECKS: ${{ vars.GOVERNED_REQUIRED_CHECKS }}
        run: python .github/scripts/run-pr-governance.py /tmp/pr.json /tmp/reviews.json /tmp/status.json /tmp/checks.json
      - name: Human merge gate
        run: echo "Governance passed; ready-to-merge is not merge authorization. Human merge remains required."
