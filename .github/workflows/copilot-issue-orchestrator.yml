name: Governed Copilot issue orchestrator
concurrency:
  group: governed-copilot-issue-${{ github.event.issue.number }}
  cancel-in-progress: false
on:
  issues:
    types: [assigned, labeled, reopened]
permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read
jobs:
  eligibility:
    if: github.event.action == 'assigned' || contains(github.event.issue.labels.*.name, 'workflow:ready')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute governed Copilot dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GOVERNED_DISPATCH_ACTORS: ${{ vars.GOVERNED_DISPATCH_ACTORS }}
          GOVERNED_PILOT_ENABLED: ${{ vars.GOVERNED_PILOT_ENABLED }}
          GOVERNED_PILOT_ISSUES: ${{ vars.GOVERNED_PILOT_ISSUES }}
          GOVERNED_IMPLEMENTER_SESSION: ${{ vars.GOVERNED_IMPLEMENTER_SESSION }}
        run: python .github/scripts/orchestrate-issue.py
      - name: Upload dispatch audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-dispatch-${{ github.event.issue.number }}-${{ github.run_id }}
          path: /tmp/governed-audit-${{ github.event.issue.number }}.jsonl
          if-no-files-found: ignore
          retention-days: 90
